name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hdrs:
    name: hdrs ${{ matrix.arch }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [ARM64, X86_64]
    steps:
      - uses: actions/checkout@v4

      - name: export headers
        run: ./scripts/hdrs.sh
        env:
          ARCH_CONFIGS: ${{ matrix.arch }}

      - name: upload headers
        uses: actions/upload-artifact@v4
        with:
          name: export-hdrs-${{ matrix.arch }}
          path: BUILD/obj/EXPORT_HDRS
          if-no-files-found: error

  kernel:
    name: kernel RELEASE X86_64
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: build kernel
        run: ./scripts/build.sh
        env:
          KERNEL_CONFIGS: RELEASE
          ARCH_CONFIGS: X86_64

      - name: upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-RELEASE-X86_64
          path: |
            BUILD/obj/RELEASE_X86_64/kernel
            BUILD/obj/RELEASE_X86_64/kernel.dSYM
          if-no-files-found: error

  boot-qemu:
    name: boot X86_64 in QEMU (xnu-loader)
    runs-on: ubuntu-24.04
    needs: kernel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools gdb

      - name: build gnu-efi
        run: ./scripts/gnuefi.sh

      - name: build xnu-loader
        run: |
          cmake -S boot/xnu-loader -B boot/xnu-loader/build -DCMAKE_BUILD_TYPE=Release -DGNU_EFI_DIR=$HOME/.local/gnu-efi
          cmake --build boot/xnu-loader/build -j

      - name: fetch kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-RELEASE-X86_64
          path: BUILD/obj

      - name: boot in qemu
        run: |
          KERNEL=$(find BUILD/obj -type f -name kernel | head -n1)
          echo "kernel: $KERNEL"
          IONI_BOOT_ARGS="-v keepsyms=1 serial=3 debug=0x8 kt=2 startup_debug=1" IONI_QEMU_TIMEOUT=600 IONI_QEMU_SMP=1 ./scripts/qemu-boot.sh "$KERNEL"

      - name: gdb corruption hunt
        if: always()
        run: |
          KERNEL=$(find BUILD/obj -type f -name kernel | head -n1)
          IONI_BOOT_ARGS="-v keepsyms=1 serial=3 debug=0x8" IONI_QEMU_TIMEOUT=400 IONI_QEMU_SMP=1 IONI_QEMU_GDB=1 ./scripts/qemu-boot.sh "$KERNEL" BUILD/hunt

      - name: upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-x86_64-logs
          path: |
            BUILD/qemu-serial.log
            BUILD/qemu-stdout.log
            BUILD/qemu-debug.log
            BUILD/lock-dump.bin
            BUILD/thread-dump.bin
            BUILD/hunt/qemu-serial.log
            BUILD/hunt/qemu-gdb-hunt.log
            BUILD/hunt/qemu-stdout.log
            BUILD/hunt/startup-table-hit0.bin
            BUILD/hunt/startup-table-end.bin
            BUILD/hunt/hunt.gdb
          if-no-files-found: warn

  kernel-arm64:
    name: kernel RELEASE ARM64 (VMAPPLE, KDK)
    runs-on: macos-26
    timeout-minutes: 180
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: build kernel
        run: ./scripts/build.sh
        env:
          KERNEL_CONFIGS: RELEASE
          ARCH_CONFIGS: ARM64
          MACHINE_CONFIGS: VMAPPLE

      - name: upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-RELEASE-ARM64
          path: |
            BUILD/obj/RELEASE_ARM64_VMAPPLE/kernel.release.vmapple
            BUILD/obj/RELEASE_ARM64_VMAPPLE/kernel.release.vmapple.dSYM
          if-no-files-found: error

  boot-vm:
    name: boot in VM (tart guest, in-guest kmutil)
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch'
    needs: kernel-arm64
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: fetch kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-RELEASE-ARM64
          path: BUILD/obj

      - name: boot test
        run: ./scripts/vm-boot.sh
        env:
          KERNEL: BUILD/obj/RELEASE_ARM64_VMAPPLE/kernel.release.vmapple

      - name: upload kernel collection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ioni-kc-ARM64
          path: BUILD/obj/ioni.*.kc
          if-no-files-found: warn

      - name: upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-boot-log
          path: BUILD/vm-boot.log
          if-no-files-found: warn

  libsystem:
    name: libsystem chain (experimental)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: build open libs
        run: ./scripts/build-libsystem.sh
        continue-on-error: true

      - name: upload fakeroot libs
        uses: actions/upload-artifact@v4
        with:
          name: libsystem-fakeroot
          path: |
            BUILD/fakeroot/usr/**/*.a
            BUILD/fakeroot/usr/**/*.dylib
            BUILD/fakeroot/usr/**/*.tbd
            BUILD/dyld-product/
          if-no-files-found: warn

  bsd-utils:
    name: bsd utils on native libc
    runs-on: macos-26
    timeout-minutes: 30
    needs: libsystem
    if: always() && needs.libsystem.result != 'skipped'
    steps:
      - uses: actions/checkout@v4

      - name: download supply archives
        uses: actions/download-artifact@v4
        with:
          name: libsystem-fakeroot
          path: BUILD/fakeroot

      - name: build utilities
        run: ./scripts/build-utils.sh

      - name: upload utilities
        uses: actions/upload-artifact@v4
        with:
          name: ioni-bsd-utils
          path: BUILD/utils/
          if-no-files-found: warn

  userland:
    name: userland init + ionish
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: make -C userland all

      - name: smoke test
        run: |
          ./userland/init -V
          ./userland/ionish -c 'echo ioni-userland-ok'

      - name: rootfs image
        run: ./scripts/rootfs.sh

      - name: upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: ioni-rootfs
          path: BUILD/ioni-rootfs.dmg
          if-no-files-found: error

  userland-hunt:
    name: userland corruption hunt (asan ubsan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: build hardened
        run: make -C userland clean all

      - name: build sanitized
        run: make -C userland hunt

      - name: run hunt suite
        run: ./tests/hunt.sh
