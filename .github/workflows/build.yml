name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hdrs:
    name: hdrs ${{ matrix.arch }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [ARM64, X86_64]
    steps:
      - uses: actions/checkout@v4

      - name: export headers
        run: ./scripts/hdrs.sh
        env:
          ARCH_CONFIGS: ${{ matrix.arch }}

      - name: upload headers
        uses: actions/upload-artifact@v4
        with:
          name: export-hdrs-${{ matrix.arch }}
          path: BUILD/obj/EXPORT_HDRS
          if-no-files-found: error

  kernel:
    name: kernel RELEASE X86_64
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: build kernel
        run: ./scripts/build.sh
        env:
          KERNEL_CONFIGS: RELEASE
          ARCH_CONFIGS: X86_64

      - name: upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-RELEASE-X86_64
          path: |
            BUILD/obj/RELEASE_X86_64/kernel
            BUILD/obj/RELEASE_X86_64/kernel.dSYM
          if-no-files-found: error

  kernel-arm64:
    name: kernel RELEASE ARM64 (experimental, needs KDK)
    runs-on: macos-26
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: build kernel
        run: ./scripts/build.sh
        env:
          KERNEL_CONFIGS: RELEASE
          ARCH_CONFIGS: ARM64

  userland:
    name: userland init + ionish
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: make -C userland all

      - name: smoke test
        run: |
          ./userland/init -V
          ./userland/ionish -c 'echo ioni-userland-ok'

      - name: rootfs image
        run: ./scripts/rootfs.sh

      - name: upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: ioni-rootfs
          path: BUILD/ioni-rootfs.dmg
          if-no-files-found: error
