name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hdrs:
    name: hdrs ${{ matrix.arch }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [ARM64, X86_64]
    steps:
      - uses: actions/checkout@v4

      - name: export headers
        run: ./scripts/hdrs.sh
        env:
          ARCH_CONFIGS: ${{ matrix.arch }}

      - name: upload headers
        uses: actions/upload-artifact@v4
        with:
          name: export-hdrs-${{ matrix.arch }}
          path: BUILD/obj/EXPORT_HDRS
          if-no-files-found: error

  kernel:
    name: kernel RELEASE ARM64 (experimental, needs KDK)
    runs-on: macos-26
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: ./scripts/build.sh
        env:
          KERNEL_CONFIGS: RELEASE
          ARCH_CONFIGS: ARM64
